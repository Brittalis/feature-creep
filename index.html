<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Feature Creep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; HUD pinned to the corners; index-card overlays centred on top. Single committed toybox look. */
:root{
  --sky:#4a35d6; --sky-deep:#231673; --plate:#f3ecdc; --ink:#17123a; --paper:#fff8e8;
  --sun:#ffd23f; --hot:#ff3d77; --mint:#3df0c2; --ice:#8cc4ff; --lilac:#d0adff; --tang:#ff9140;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
body{background:var(--sky-deep);color:var(--paper);font-family:var(--body);font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:relative;height:100%;overflow:hidden;background:var(--sky)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding-block:12px}
.hudrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stat{font-family:var(--display);line-height:1;text-shadow:3px 3px 0 var(--ink)}
#score{font-size:clamp(26px,5vw,44px);font-variant-numeric:tabular-nums}
#mult{font-family:var(--body);font-weight:700;font-size:14px;color:var(--sun);letter-spacing:.06em;margin-top:6px;text-shadow:2px 2px 0 var(--ink)}
#mid{flex:1;max-width:340px;min-width:0;text-align:center}
#phase{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-shadow:2px 2px 0 var(--ink)}
#foresee{font-size:11px;font-weight:700;letter-spacing:.04em;margin-top:4px;color:var(--lilac);text-shadow:1px 1px 0 var(--ink)}
#bar{height:12px;border:3px solid var(--ink);background:var(--sky-deep);margin-top:6px}
#bar.ready #barfill{background:var(--mint);animation:ready .6s ease-in-out infinite alternate}
@keyframes ready{to{opacity:.45}}
#barfill{height:100%;width:100%;background:var(--sun);transform-origin:left}
#hearts{font-size:clamp(20px,4vw,30px);letter-spacing:2px;color:var(--hot);text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
#hearts i{font-style:normal;color:var(--sky-deep)}
#chips{display:flex;flex-wrap:wrap;gap:4px;max-width:min(440px,34%);max-height:104px;overflow:hidden;opacity:.9}
.chip b{color:var(--sun)}
.chip{font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 6px;background:var(--ink);border-left:6px solid var(--c)}
#mute,#pausebtn{pointer-events:auto;font:700 12px var(--body);letter-spacing:.1em;color:var(--paper);background:var(--ink);border:0;padding:6px 10px;cursor:pointer}
#tracker{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(620px,56%);display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.trk,.abl{position:relative;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;background:var(--ink);border:1px solid var(--hot);overflow:hidden;white-space:nowrap}
.trk i,.abl i{position:absolute;inset:0;background:var(--hot);opacity:.6;transform-origin:left;transform:scaleX(0)}
.trk b,.abl b{position:relative;font-weight:700}
.trk.fire{animation:trkfire .5s ease-out}
@keyframes trkfire{0%{background:var(--paper);transform:scale(1.3)}100%{transform:scale(1)}}
#abil{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.abl{font-size:11px;padding:4px 9px;border:2px solid var(--sun)}
.abl i{background:var(--sun);opacity:.45}
#pauselist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;width:100%;max-width:980px}
.pc{background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:8px 10px;font-size:13px;line-height:1.4;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pc b{font-size:15px}
.pc em{font-style:normal;font-weight:700;font-size:12px;opacity:.7}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-size:clamp(30px,8vw,84px);
  line-height:1;text-shadow:5px 5px 0 var(--ink);pointer-events:none;opacity:0}
#banner.go{animation:pop 1.3s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(1.6) rotate(-4deg)}15%{opacity:1;transform:scale(1) rotate(-2deg)}75%{opacity:1}100%{opacity:0;transform:scale(.96) rotate(-2deg)}}
.float.bounty{color:var(--hot);font-size:17px}
.float.gold{font-size:26px;color:var(--paper);text-shadow:0 0 12px var(--sun),2px 2px 0 var(--ink)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,var(--hot) 140%)}
#flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#score{transform-origin:left center}
#score.bump{animation:bump .2s ease-out}
@keyframes bump{0%{transform:scale(1.22)}100%{transform:scale(1)}}
.float{position:absolute;font-family:var(--display);font-size:20px;color:var(--sun);text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:rise .8s ease-out forwards;white-space:nowrap}
@keyframes rise{to{transform:translateY(-46px);opacity:0}}

/* Overlays */
.overlay>:first-child{margin-top:auto}
.overlay>:last-child{margin-bottom:auto}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;
  background:rgba(23,18,58,.62);padding-block:64px 24px;overflow-y:auto;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.overlay h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,10vw,92px);line-height:.9;margin:0;text-align:center;
  text-shadow:6px 6px 0 var(--hot);text-wrap:balance}
.overlay h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,5vw,40px);line-height:1;margin:0;text-align:center;text-shadow:3px 3px 0 var(--ink);text-wrap:balance}
.overlay p{margin:0;max-width:56ch;text-align:center;line-height:1.5;font-size:17px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--sun)}
.keys{font-size:14px;opacity:.85}
kbd{font:700 12px var(--body);background:var(--ink);padding:2px 6px;border:1px solid var(--paper)}
.btn{font-family:var(--display);font-size:20px;color:var(--ink);background:var(--sun);border:4px solid var(--ink);padding:12px 26px;
  box-shadow:6px 6px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{font-family:var(--body);font-weight:700;font-size:14px;letter-spacing:.08em;background:transparent;color:var(--paper);border-color:var(--paper);box-shadow:none;padding:8px 14px}
.btn.alt{background:var(--mint)}
#codein{font:600 15px var(--body);padding:9px 12px;border:3px solid var(--paper);background:var(--ink);color:var(--paper);min-width:0;width:min(300px,62vw);-webkit-user-select:text;user-select:text}
#codein::placeholder{color:var(--lilac)}
.sr{position:absolute;left:-9999px}
#career,#unlocks{text-align:center;line-height:1.6;max-width:70ch}
.btn.ghost:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}

#cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:100%;max-width:980px}
.card{flex:1 1 240px;max-width:300px;min-width:0;text-align:left;font-family:var(--body);color:var(--ink);background:var(--paper);
  border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:16px 16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;
  transition:transform .1s,box-shadow .1s}
.card:nth-child(1){transform:rotate(-1.5deg)} .card:nth-child(3){transform:rotate(1.5deg)}
.card:hover,.card:focus-visible{transform:translateY(-8px) rotate(0);box-shadow:12px 14px 0 var(--ink)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .cat,.pc .cat{font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;background:var(--c);padding:3px 8px;border:2px solid var(--ink)}
.card .tag{font-weight:700;font-size:12px;letter-spacing:.1em}
.card .name{font-family:var(--display);font-size:24px;line-height:1.05}
.card .desc{font-size:15px;line-height:1.4;min-height:3.9em;flex:1}

.card .pay{font-weight:700;font-size:13px;border-top:2px dashed var(--ink);padding-top:8px}
.card .num{font-weight:700;font-size:12px;letter-spacing:.1em;opacity:.55}
#lb{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:260px;background:var(--ink);border:3px solid var(--paper);box-shadow:6px 6px 0 var(--hot);padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left}
#lb h3{margin:0;font-family:var(--display);font-weight:400;font-size:18px;color:var(--sun)}
#lblist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
#lblist button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:2ch 1fr auto;gap:8px;align-items:baseline;padding:3px 4px;font-size:14px;cursor:pointer}
#lblist button:hover,#lblist button:focus-visible{background:var(--sky-deep);outline:none}
#lblist .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#lblist .rk{color:var(--lilac);font-weight:700}
#lblist .sc{font-weight:700;color:var(--sun)}
#lblist .tg{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mint);margin-left:4px}
#lbtabs{display:flex;gap:4px}
#lbtabs button{all:unset;box-sizing:border-box;flex:1;text-align:center;padding:4px 6px;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;border:2px solid var(--paper);color:var(--paper)}
#lbtabs button[aria-selected=true]{background:var(--sun);border-color:var(--sun);color:var(--ink)}
#lbtabs button:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
#lbnote{font-size:12px;color:var(--lilac);margin:0}
#submitbox{display:flex;flex-direction:column;align-items:center;gap:8px}
#lbname{font:600 15px var(--body);padding:9px 12px;border:3px solid var(--paper);background:var(--ink);color:var(--paper);width:min(220px,52vw);min-width:0;-webkit-user-select:text;user-select:text}
#lbname::placeholder{color:var(--lilac)}
#lbmsg{min-height:1.2em}
#sheet,#codein{font-feature-settings:"calt" 0,"liga" 0;font-variant-ligatures:none}
#sheet{font:400 13px/1.5 var(--body);overflow-wrap:anywhere;white-space:pre-wrap;text-align:left;background:var(--paper);color:var(--ink);border:4px solid var(--ink);
  box-shadow:8px 8px 0 var(--ink);padding:14px 16px;margin:0;width:100%;max-width:520px;box-sizing:border-box}
.rowbtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
#finalscore{font-family:var(--display);font-size:clamp(34px,7vw,60px);color:var(--sun);text-shadow:4px 4px 0 var(--ink);line-height:1}

/* Touch */
#touch{position:absolute;inset:0;pointer-events:none}
#stickbase{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border:3px solid var(--paper);border-radius:50%;opacity:.5}
#stickknob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;background:var(--paper);border-radius:50%}
#tbtns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:10px;max-width:220px;pointer-events:auto}
.tbtn{width:62px;height:62px;border-radius:50%;border:4px solid var(--ink);background:var(--sun);color:var(--ink);font:700 13px var(--body);letter-spacing:.06em}
.tbtn[data-a=jump]{background:var(--sun)}
.tbtn{background:var(--mint)}
@media (pointer:coarse){#abil{display:none}}
@media (max-width:640px){
  #lb{position:static;width:100%;max-width:360px;box-sizing:border-box}
  #chips,#phase .cnt{display:none}
  #phase{font-size:11px;white-space:nowrap}
  #tracker{top:84px}
  #abil{bottom:48px}
  .card{flex-basis:100%;max-width:none;padding:10px 12px 12px;gap:4px;transform:none!important;box-shadow:5px 5px 0 var(--ink)}
  .card .name{font-size:19px} .card .desc{min-height:0;font-size:14px}
  .overlay{gap:12px;padding-top:72px} .overlay h1{line-height:1.05;text-shadow:4px 4px 0 var(--hot)} .overlay p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){#banner.go,.float,#flash.go,#score.bump,.trk.fire{animation-duration:.01s}.card,.btn{transition:none}}
</style>

<div id="stage">
  <canvas id="gl"></canvas>

  <div id="hud" class="gutter" hidden>
    <div class="hudrow">
      <div><div id="score" class="stat">0</div><div id="mult">Income 0 · Bounties 0</div></div>
      <div id="mid"><div id="phase">0:00</div><div id="bar"><div id="barfill"></div></div><div id="foresee"></div></div>
      <div id="hearts"></div>
    </div>
    <div class="hudrow" style="align-items:flex-end">
      <div id="chips"></div>
      <div style="display:flex;gap:6px"><button id="pausebtn" type="button">PAUSE</button><button id="mute" type="button">SOUND ON</button></div>
    </div>
    <div id="tracker"></div>
    <div id="abil"></div>
  </div>
  <div id="flash"></div>
  <div id="banner"></div>
  <div id="floats"></div>

  <div id="touch" hidden>
    <div id="stickbase" hidden><div id="stickknob"></div></div>
    <div id="tbtns"></div>
  </div>

  <div id="title" class="overlay gutter">
    <h1>Feature<br>Creep</h1>
    <p>Pick a card. Play. Repeat until your game beats you.</p>
    <p class="keys"><kbd>WASD</kbd> roll · <kbd>Space</kbd> jump · <kbd>Esc</kbd> pause</p>
    <div class="rowbtns">
      <button id="start" class="btn" type="button">Start the build</button>
      <button id="daily" class="btn alt" type="button">Daily build</button>
    </div>
    <form id="codeform" class="rowbtns">
      <label class="sr" for="codein">Build code</label>
      <input id="codein" type="text" placeholder="Paste a build code" autocomplete="off" spellcheck="false">
      <button id="playcode" class="btn ghost" type="submit">PLAY CODE</button>
    </form>
    <div id="codeerr" class="eyebrow" hidden></div>
    <div id="career" class="eyebrow"></div>
    <aside id="lb" hidden aria-label="Leaderboard">
      <h3>Leaderboard</h3>
      <div id="lbtabs" role="tablist">
        <button type="button" role="tab" id="tabAll" aria-selected="true" data-tab="all">All time</button>
        <button type="button" role="tab" id="tabVer" aria-selected="false" data-tab="ver">Current Version</button>
      </div>
      <ol id="lblist"></ol>
      <p id="lbnote">Loading…</p>
    </aside>
    <button id="unlockall" class="btn ghost" type="button">UNLOCK ALL CARDS</button>
  </div>

  <div id="pick" class="overlay gutter" hidden>
    <div class="eyebrow" id="pickeyebrow">Pick 1 · Rule</div>
    <h2 id="pickhead">What is this game about?</h2>
    <div id="cards"></div>
    <div class="rowbtns"><button id="reroll" class="btn ghost" type="button">REROLL (1 LEFT)</button><button id="skip" class="btn ghost" type="button" hidden>KEEP EVERYTHING</button></div>
  </div>

  <div id="pause" class="overlay gutter" hidden>
    <div class="eyebrow">Paused</div>
    <h2>Your build</h2>
    <p class="keys" id="pausekeys"></p>
    <p class="keys" id="recipe"></p>
    <div id="pauselist"></div>
    <div class="rowbtns">
      <button id="resume" class="btn" type="button">Resume</button>
      <button id="endrun" class="btn ghost" type="button">END RUN</button>
    </div>
  </div>

  <div id="over" class="overlay gutter" hidden>
    <div class="eyebrow" id="overeyebrow">Shipped</div>
    <h2 id="gamename">Untitled</h2>
    <div id="finalscore">0</div>
    <div id="unlocks" class="eyebrow"></div>
    <form id="submitbox" hidden>
      <div class="rowbtns">
        <label class="sr" for="lbname">Your name</label>
        <input id="lbname" type="text" maxlength="16" placeholder="Your name" autocomplete="nickname" spellcheck="false">
        <button id="lbsubmit" class="btn alt" type="submit">Submit score</button>
      </div>
      <div id="lbmsg" class="eyebrow"></div>
    </form>
    <pre id="sheet"></pre>
    <div class="rowbtns">
      <button id="again" class="btn" type="button">New build</button>
      <button id="home" class="btn ghost" type="button">TITLE</button>
      <button id="copycode" class="btn ghost" type="button">COPY BUILD CODE</button>
      <button id="copy" class="btn ghost" type="button">COPY BUILD SHEET</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE, V3=T.Vector3, $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a), clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const reduceMotion=matchMedia('(prefers-reduced-motion:reduce)').matches;
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ---------- cards: Rules, Prompts, Modifiers ---------- */
const TYPE={rule:['Rule','--mint'],prompt:['Prompt','--hot'],mod:['Modifier','--sun'],cut:['Cut','--tang']};
const MODS=[
 {id:'count',name:'Double',f:2},
 {id:'size',name:'Giant',f:1.6},
 {id:'speed',name:'Turbo',f:1.5},
 {id:'force',name:'Heavy',f:1.6},
 {id:'score',name:'Golden',f:2},
];
const CARDS=[
 // Rules that earn steady income
 {id:'orbs',type:'rule',goal:1,name:'Hoarder',desc:'Glowing orbs litter the plate. Grab them.',earn:'10 per orb',word:'Heist',pitch:'hoard orbs',mods:{count:'Twice as many orbs on the plate.',size:'Orbs are bigger and easier to grab.'}},
 {id:'sumo',type:'rule',goal:1,name:'Bouncer',desc:'Wobbly pins wander in. Shove them off the edge.',earn:'25 per pin',word:'Bouncer',pitch:'shove pins off the edge',mods:{count:'Twice as many pins.'}},
 {id:'hill',type:'rule',goal:1,name:'Spotlight',desc:'A drifting spotlight pays for as long as you stand in it.',earn:'12 per second inside',word:'Spotlight',pitch:'hog the spotlight',mods:{size:'The spotlight is 1.6× wider.'}},
 {id:'air',type:'rule',goal:1,name:'Airtime',desc:'You get paid whenever you are off the ground.',earn:'16 per second airborne',word:'Airtime',pitch:'stay airborne'},
 {id:'tag',type:'rule',goal:1,name:'Tag',desc:'A golden runner flees from you. Catch it.',earn:'40 per catch',word:'Tag',pitch:'chase down runners',mods:{count:'Two runners at once.'}},
 {id:'courier',type:'rule',goal:1,name:'Checkpoints',desc:'A beacon marks a spot across the plate. Reach it and the next one lights up.',earn:'20 per checkpoint',word:'Rally',pitch:'race between checkpoints',mods:{size:'Checkpoints are 1.6× wider.'}},
 // Rules that never score
 {id:'combo',type:'rule',name:'Hot Streak',desc:'Scoring again within 2 seconds builds a streak, up to ×2 on everything.',word:'Streaky'},
 {id:'greed',type:'rule',name:'Daredevil',desc:'Rule income is doubled while you are in the outer band of the plate.',word:'Reckless'},
 {id:'pogo',type:'rule',name:'Pogo Stick',desc:'You bounce every time you land. You never sit still again.',pitch:'pogo',word:'Pogo',mods:{force:'Bounces go 1.6× higher.'}},
 {id:'big',type:'rule',name:'Big Ball Energy',desc:'You are huge and three times as heavy.',word:'Big'},
 {id:'medkit',type:'rule',name:'Medkit',desc:'A heart drops onto the plate midway through every sprint.',mods:{count:'Two hearts per sprint.'}},
 {id:'dash',type:'rule',name:'Dash',desc:'Shift: ram forward, heavy as a truck.',pitch:'dash',mods:{force:'Dash goes 1.6× faster and hits harder.',speed:'Dash recharges 1.5× faster.'}},
 {id:'slam',type:'rule',name:'Ground Pound',desc:'Jump again in mid-air to slam down with a shockwave.',pitch:'ground-pound',mods:{size:'Shockwave reaches 1.6× further.',force:'Shockwave throws 1.6× harder.'}},
 {id:'blaster',type:'rule',name:'Autoblaster',desc:'Fires at the nearest target by itself. Shots shove.',pitch:'blast',mods:{speed:'Fires 1.5× faster.',force:'Shots shove 1.6× harder.'}},
 {id:'orbit',type:'rule',name:'Wrecking Balls',desc:'Iron balls orbit you and bat away whatever they touch.',pitch:'swing wrecking balls',mods:{count:'Twice as many balls.',size:'Bigger balls on a wider orbit.',speed:'Balls spin 1.5× faster.',force:'Balls hit 1.6× harder.'}},
 {id:'magnet',type:'rule',name:'Magnet',desc:'Orbs, coins and hearts fly to you from across the plate.',pitch:'magnetize loot',mods:{size:'Magnet reaches 1.6× further.'}},
 {id:'ice',type:'rule',slot:'floor',name:'Ice Rink',desc:'No grip for anyone. All rule income ×1.5.',word:'Frozen'},

  const loop=(pts,y)=>fenceG.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(pts.map(p=>new T.Vector3(p[0],y,p[1]))),lm));

function paintedAt(x,z){const PX=R0*ARENA.ext,cw=2*PX/PN,i=Math.floor((x+PX)/cw),j=Math.floor((z+PX)/cw);return i>=0&&j>=0&&i<PN&&j<PN&&pcell[j*PN+i]>0}

  for(const q of pitList)if(q.warn<=0&&q.open>0&&Math.hypot(x-q.x,z-q.z)<q.r)return true;

let AC=null,muted=false,sfxG=null,musG=null,noiseBuf=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();sfxG=AC.createGain();sfxG.connect(AC.destination);
  musG=AC.createGain();musG.gain.value=.4;musG.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
let voices=0;const VMAX=24;
function tone(dest,t,f,d,type,vol,slide,attack){if(voices>=VMAX)return;voices++;setTimeout(()=>voices--,(d+.05+Math.max(0,t-(AC?AC.currentTime:0)))*1000);try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  if(attack){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+attack)}else g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02)}catch(e){}}
function hiss(dest,t,d,vol,ftype,freq,to){if(voices>=VMAX)return;voices++;setTimeout(()=>voices--,(d+.05+Math.max(0,t-(AC?AC.currentTime:0)))*1000);try{const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;s.loop=true;
  fl.type=ftype;fl.frequency.setValueAtTime(freq,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dest);s.start(t,Math.random()*.5);s.stop(t+d+.02)}catch(e){}}
function snd(f,d=.08,type='square',vol=.05,slide=0,delay=0){if(!AC||muted)return;tone(sfxG,AC.currentTime+delay,f,d,type,vol,slide)}
function nz(d,vol,ftype='lowpass',freq=600,to=0,delay=0){if(!AC||muted)return;hiss(sfxG,AC.currentTime+delay,d,vol,ftype,freq,to)}
// Music: a 16-step loop that gains one layer for every card you own. The seed picks the key and the lead line.
const mus={t:0,step:0,mel:[],root:98};
function musicSetup(){let a=(S.seed>>>0)||1;const r=()=>(a=(Math.imul(a,1664525)+1013904223)>>>0)/4294967296;
  mus.mel=Array.from({length:32},()=>r()<.3?null:Math.floor(r()*6));mus.root=98*Math.pow(2,Math.floor(r()*5)/12);mus.step=0}
function music(){
  if(!AC||muted||S.phase==='title'||S.phase==='over')return;
  const n=S.picks.length,play=S.phase==='play',sd=60/(108+Math.min(36,n*2))/4;
  if(mus.t<AC.currentTime)mus.t=AC.currentTime+.06;
  while(mus.t<AC.currentTime+.14){
    const s=mus.step,b=s%16,bar=s>>4,t=mus.t,minor=S.boss||L('night')||L('lava')||L('mines')||L('meteors'),sc=minor?[0,3,5,7,10]:[0,2,4,7,9];
    const nt=(deg,oct)=>mus.root*Math.pow(2,oct+(sc[((deg%5)+5)%5]+12*Math.floor(deg/5))/12),ch=[0,3,4,2][bar%4],ly=S.boss?11:n+1;
    if(!play){if(b===0)for(const d of[0,2,4])tone(musG,t,nt(ch+d,1),sd*15,'triangle',.05,0,.3)}
    else{
      if(b%4===0)tone(musG,t,150,.14,'sine',.5,-110);                                               // kick, always
      if(ly>=2&&[0,3,6,8,11,14].includes(b))tone(musG,t,nt(ch,0),sd*1.6,'sawtooth',.11);              // bass
      if(ly>=3&&b%4===2)hiss(musG,t,.04,.12,'highpass',7000);                                         // hat
      if(ly>=4&&(b===4||b===12)){hiss(musG,t,.14,.22,'bandpass',1800);tone(musG,t,190,.08,'triangle',.12,-80)} // snare
      if(ly>=5&&b%2===0)tone(musG,t,nt(ch+[0,2,4,2,5,4,2,4][b/2],2),sd*1.2,'square',.035);             // arp
      if(ly>=6&&b===0)for(const d of[0,2,4])tone(musG,t,nt(ch+d,1),sd*15,'triangle',.04,0,.25);        // pad
      if(ly>=7){const m=mus.mel[(bar%2)*16+b];if(m!==null&&b%2===0)tone(musG,t,nt(ch+m,3),sd*2.2,'triangle',.06)} // lead
      if(ly>=8&&b%2===1)hiss(musG,t,.025,.06,'highpass',9000);                                        // sixteenth hats
      if(ly>=9&&b%4===3)tone(musG,t,nt(ch+4,3),sd*.9,'square',.02);                                   // sparkle
      if(ly>=10&&(b===2||b===10))tone(musG,t,75,.1,'sine',.35,-40);                                   // extra kick
      if(ly>=11&&b%8===6)tone(musG,t,nt(ch+7,2),sd*3,'sawtooth',.03);                                 // counter line
    }
    mus.t+=sd;mus.step=(s+1)%64;
  }
}

/* ---------- edge rules ---------- */
function edgeRule(b,dt){
  if(b.kind==='boulder'&&!L('pinwiz'))return;b.rimCd=(b.rimCd||0)-dt;
  const fe=L('fence')||(b.kind==='boulder'&&L('pinwiz')),ri=L('rim')&&b.kind!=='boulder',wr=L('wrap')&&b.kind!=='boulder';if(!fe&&!ri&&!wr)return;
  const sd=ARENA.sd(b.p.x,b.p.z),fl=ARENA.fy(b.p.x,b.p.z),h=b.p.y-fl;
  if((fe||ri)&&sd<-b.r*.35&&h<1.8&&h>-.6&&!(ri&&b.rimCd>0)){
    const[ix,iz]=ARENA.inward(b.p.x,b.p.z),vn=b.v.x*ix+b.v.z*iz,push=-sd-b.r*.35+.02;b.p.x+=ix*push;b.p.z+=iz*push;
    if(vn<0){const k=fe?1.5:2.4;b.v.x-=vn*ix*k;b.v.z-=vn*iz*k;if(b.kind==='boulder'){const dn=b.dx*ix+b.dz*iz;if(dn<0){b.dx-=2*dn*ix;b.dz-=2*dn*iz}}}
    if(ri){b.v.x+=ix*6;b.v.z+=iz*6;b.v.y=Math.max(b.v.y,5);b.rimCd=1;if(b===player){snd(500,.12,'triangle',.06,300);shake=Math.max(shake,.2)}}}
  if(wr&&!ARENA.on(b.p.x,b.p.z)&&b.p.y<fl-2.5){
    const[x,z]=ARENA.nearest(-b.p.x,-b.p.z,1.5);b.p.set(x,fl+9,z);b.v.x*=.4;b.v.z*=.4;b.v.y=0;if(b===player){emit('wrap');if(L('laprunner'))add(20,'laprunner',player.p.clone());if(L('armored')&&S.unbanked>0){S.score+=S.unbanked;floater('Banked '+fmt(S.unbanked),player.p.clone(),false,true);S.unbanked=0}ringFx(x,z,2,0xd0adff);snd(900,.2,'sine',.06,-500)}}
}

function doGrapple(){const f=mv('grapple','force');cdmax.grapple=cds.grapple=2.5/mv('grapple','speed');snd(500,.15,'square',.05,700);
  const off=!ARENA.on(player.p.x,player.p.z)||player.p.y<ARENA.fy(player.p.x,player.p.z)-.2;let tgt=null,bd=13;
  if(!off)for(const b of bodies){if(b===player||b.kind==='boulder'||b.dead)continue;const d=b.p.distanceTo(player.p);if(d<bd){bd=d;tgt=b}}
  if(tgt){const dx=tgt.p.x-player.p.x,dz=tgt.p.z-player.p.z,d=Math.hypot(dx,dz)||1,nx=dx/d,nz=dz/d,k=12*f,tk=k/Math.sqrt(tgt.m);
    if(L('swinger')){let gap=false;for(let i=1;i<8;i++)if(!ARENA.on(player.p.x+dx*i/8,player.p.z+dz*i/8)){gap=true;break}if(gap)add(30,'swinger',player.p.clone())}
    player.v.x+=nx*k;player.v.z+=nz*k;player.v.y+=3;tgt.v.x-=nx*tk;tgt.v.z-=nz*tk;tgt.v.y+=3;hookTo.copy(tgt.p)}
  else if(off){const[fx,fz]=ARENA.nearest(player.p.x,player.p.z,1.5),dx=fx-player.p.x,dz=fz-player.p.z,dd=Math.hypot(dx,dz)||1;player.v.x=dx/dd*(7+dd*.9);player.v.z=dz/dd*(7+dd*.9);player.v.y=Math.min(24,Math.sqrt(2*G0*(Math.max(0,ARENA.fy(fx,fz)-player.p.y)+2.5)));player.slam=false;hookTo.set(fx,0,fz)}
  else{player.v.x+=player.face.x*10*f;player.v.z+=player.face.z*10*f;hookTo.copy(player.p).addScaledVector(player.face,6)}
  hookT=.22}

  for(let i=0;i<n;i++){const m=new T.Mesh(GEO.sphere,MAT.iron);m.scale.setScalar(.32);m.position.copy(player.p);world.add(m);

function doBlink(){cdmax.blink=cds.blink=3/mv('blink','speed');const d=5*mv('blink','size');ringFx(player.p.x,player.p.z,2,0xd0adff);ghost(player.p,player.r,0xd0adff);
  let x=player.p.x+player.face.x*d,z=player.p.z+player.face.z*d;const on=ARENA.on(player.p.x,player.p.z);
  if(L('phase'))for(const b of bodies){if(b.kind!=='runner'||b.dead)continue;const px=b.p.x-player.p.x,pz=b.p.z-player.p.z,al=clamp(px*player.face.x+pz*player.face.z,0,d);if(Math.hypot(px-player.face.x*al,pz-player.face.z*al)<1.3){b.dead=true;world.remove(b.mesh);add(PAY.tag,'tag',b.p.clone());burst(b.p,0xffd23f,10)}}for(let k=0;on&&k<12&&!ARENA.on(x,z,.4);k++){x=(x+player.p.x)/2;z=(z+player.p.z)/2}
  player.p.x=x;player.p.z=z;player.inv=Math.max(player.inv,.35);ringFx(x,z,2,0xd0adff);snd(900,.12,'sine',.07,900)}

/* ---------- simulation ---------- */
const fwd=new V3(),right=new V3();
const nx_=(c,d2)=>c/Math.sqrt(d2);
const wrap=a=>{a=(a+Math.PI)%(2*Math.PI);if(a<0)a+=2*Math.PI;return a-Math.PI};
function update(dt){
  S.t+=dt;
  const ramp=(1+Math.max(0,S.t-120)/400)*(S.boss?1.6:1);
  const g=G0*(L('moon')?.42:1), ice=L('ice'), fr=ice?.45:L('sticky')?14:5, bouncy=L('bouncy');
  // plate radius
  let Rb=R0*(L('tiny')?.8:1)*(L('mega')?1.45:1);
  if(L('shrink')){const ph=S.t*.8*mv('shrink','speed');Rb*=1-.26*(.5-.5*Math.cos(ph));
    const cyc=Math.floor(ph/6.283);if(cyc>ev.shrinkCycle){ev.shrinkCycle=cyc;snd(260,.45,'sine',.06,-130);if(S.lastFall<ev.shrinkStart)add(PAY.shrink,'shrink',player.p.clone());ev.shrinkStart=S.t}}
  R=Rb; plate.scale.set(R/R0,1,R/R0);
  // tilt
  // tilt: Tilt-a-World circles, Seesaw follows the weight, Wobble shudders
  let gx=0,gz=0;
  if(L('tilt')){const m=.15*Math.min(1,S.t/3),ph=S.t*.35;gx=Math.cos(ph)*m;gz=Math.sin(ph)*m}
  else if(L('seesaw')){let mx=0,mz=0,ms=0;for(const b of bodies)if(b.g&&(b===player||!L('heavyweight'))){mx+=b.p.x*b.m;mz+=b.p.z*b.m;ms+=b.m}if(ms){const k=(L('heavyweight')?.26:.16)/R;gx=clamp(mx/ms*k,-.16,.16);gz=clamp(mz/ms*k,-.16,.16)}}
  else if(L('wobble')){ev.wobT=(ev.wobT??3)-dt;if(ev.wobT<=0){ev.wobT=rand(2.5,4.5);const a=rand(0,6.283);ev.wx=Math.cos(a)*.13;ev.wz=Math.sin(a)*.13;ev.wobOn=.8;shake=Math.max(shake,.25);snd(70,.3,'sine',.08,30)}
    if(ev.wobOn>0){ev.wobOn-=dt;gx=ev.wx;gz=ev.wz}}
  ev.tvx=(ev.tvx||0)+(gx-(ev.tvx||0))*Math.min(1,(L('wobble')?8:2.5)*dt);ev.tvz=(ev.tvz||0)+(gz-(ev.tvz||0))*Math.min(1,(L('wobble')?8:2.5)*dt);
  const tx=ev.tvx*G0*2.6, tz=ev.tvz*G0*2.6;
  world.rotation.z=-ev.tvx; world.rotation.x=ev.tvz;
  // Turntable: the plate (and what sits on it) rotates
  if(L('turntable')){const w=.32*mv('turntable','speed')*dt,c=Math.cos(w),s=Math.sin(w);ARENA.rot+=w;plate.rotation.y=-ARENA.rot;
    const spin=o=>{const x=o.x*c-o.z*s;o.z=o.x*s+o.z*c;o.x=x};for(const b of bodies)if(b.g){spin(b.p);const vx=b.v.x*c-b.v.z*s;b.v.z=b.v.x*s+b.v.z*c;b.v.x=vx}
    for(const o of orbs)spin(o.p);for(const m of mines)spin(m.p);for(const bm of bumpers){spin(bm.p)}for(const o of pks)spin(o.p)}
  else if(ARENA.rot){ARENA.rot=0;plate.rotation.y=0}
  // Conveyor lanes push along x, alternating with z
  if(L('conveyor')){const f=7*mv('conveyor','force');for(const b of bodies)if(b.g&&b.kind!=='boulder'){const dir=(Math.floor(b.p.z/LANE+1000)%2)?1:-1;b.v.x+=dir*f*dt}}
  // Crumble: tiles under you crack, fall, and regrow
  if(L('crumble')){if(player.g){const k=cellOf(player.p.x,player.p.z);if(k>=0&&crumb[k]===0&&!(L('freshcoat')&&paintedAt(player.p.x,player.p.z))){crumb[k]=.8;holesDirty=true}}
    for(let k=0;k<crumb.length;k++){const v=crumb[k];if(v===0)continue;if(v>0){crumb[k]=v-dt;if(crumb[k]<=0){crumb[k]=-6;snd(160,.08,'square',.02,-60)}holesDirty=true}else{crumb[k]=v+dt;if(crumb[k]>=0){crumb[k]=0;holesDirty=true}}}}
  // pits, quakes
  for(const q of pitList){if(q.warn>0){q.warn-=dt;if(q.warn<=0)holesDirty=true}else{q.open-=dt;if(!q.paid&&q.open<=2.6){q.paid=true;if(Math.hypot(player.p.x-q.x,player.p.z-q.z)>q.r)add(PAY.pits,'pits',tmp.set(q.x,.6,q.z).clone())}if(q.open<=0)holesDirty=true}}
  if(pitList.some(q=>q.open<=0))pitList=pitList.filter(q=>q.open>0);
  if(ev.quakeT>0){ev.quakeT-=dt;shake=Math.max(shake,.2);if(ev.quakeT<=0){holesDirty=true;if(S.lastFall<ev.quakeStart)add(PAY.quake,'quake',player.p.clone(),L('aftershock')?2:1)}}
  if(holesDirty){holesDirty=false;drawHoles()}
  // tornado
  if(tw.t>0){tw.t-=dt;tw.p.addScaledVector(tw.v,dt);if(!ARENA.on(tw.p.x,tw.p.z,2)){const[ix,iz]=ARENA.inward(tw.p.x,tw.p.z);tw.v.set(ix*2.5,0,iz*2.5)}
    const rr=3.2*mv('tornado','size'),f=mv('tornado','force');
    for(const b of bodies){if(b.kind==='boulder'||b.kind==='boss')continue;const dx=tw.p.x-b.p.x,dz=tw.p.z-b.p.z,d=Math.hypot(dx,dz);if(d<rr){const k=(1-d/rr)*f;b.v.x+=(dx/d*6-dz/d*9)*k*dt;b.v.z+=(dz/d*6+dx/d*9)*k*dt;b.v.y+=22*k*dt}}
    if(tw.t<=0){tw.mesh.visible=false;if(S.lastFall<tw.start)add(PAY.tornado,'tornado',player.p.clone())}}
  // flood
  if(ev.floodT>0){ev.floodT-=dt;const lvl=Math.min(1,(6-ev.floodT)/3.5);water.visible=true;water.scale.set(R*ARENA.ext*1.05,lvl*1.1,R*ARENA.ext*1.05);water.position.y=lvl*.55;
    if(!ev.floodPeaked&&lvl>=1){ev.floodPeaked=true;const dry=player.p.y-player.r>.9||L('waterwalk');if(dry)add(PAY.flood,'flood',player.p.clone());else{hurt(0,0);banner('Soaked')}}
    if(ev.floodT<=0){water.visible=false;floodPads=[];buildPads();ev.floodPeaked=false}}
  // arena swap
  if(ev.swapT>0){ev.swapT-=dt;if(ev.swapT<=0){ARENA.set(ev.swapBack||'disc');if(S.lastFall<ev.swapStart)add(PAY.swap,'swap',player.p.clone());banner('Back to normal')}}
  // storm
  if(L('storm')){ev.boltT=(ev.boltT??3)-dt;if(ev.boltT<=0&&!boltMk.visible){let x=player.p.x+rand(-2.5,2.5),z=player.p.z+rand(-2.5,2.5);
    if(L('rod')){let best=null,bd=12;for(const b of bodies){if(b===player||b.kind==='boulder')continue;const d=b.p.distanceTo(player.p);if(d<bd){bd=d;best=b}}if(best){x=best.p.x;z=best.p.z}}boltMk.position.set(x,.07+ARENA.fy(x,z),z);boltMk.scale.setScalar(1.6);boltMk.visible=true;ev.boltWarn=1}
    if(boltMk.visible){ev.boltWarn-=dt;if(ev.boltWarn<=0){boltMk.visible=false;ev.boltT=rand(3,5);flashBolt();const d=Math.hypot(player.p.x-boltMk.position.x,player.p.z-boltMk.position.z);if(L('rod')&&bodies.some(b=>b!==player&&Math.hypot(b.p.x-boltMk.position.x,b.p.z-boltMk.position.z)<1.8))add(15,'rod',boltMk.position.clone());if(d<1.6&&!L('rod'))hurt(player.p.x-boltMk.position.x,player.p.z-boltMk.position.z);shockwave(boltMk.position.x,boltMk.position.z,2,8,true)}}}
  else boltMk.visible=false;

  // --- player control
  fwd.copy(camFwd);right.set(-fwd.z,0,fwd.x);
  let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+stick.x, iy=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+stick.y;
  const il=Math.hypot(ix,iy);if(il>1){ix/=il;iy/=il}
  if(ev.mirrorT>0){ix=-ix;iy=-iy}
  const mx=fwd.x*iy+right.x*ix, mz=fwd.z*iy+right.z*ix;
  if(il>.1)player.face.set(mx,0,mz).normalize();
  const acc=player.g?(ice?13:L('sticky')?26:38):15;
  player.v.x+=mx*acc*dt;player.v.z+=mz*acc*dt;
  if(L('glider')&&!player.g&&(keys.Space||jumpHeld)&&player.v.y<-2.5)player.v.y=-2.5;
  player.coyote=player.g?.12:player.coyote-dt;if(player.g)player.airJ=L('djump')?Math.round(mv('djump','count'))+(L('triple')?1:0):0;
  if(jumpQ){
    if(player.coyote>0){player.v.y=9.6;player.coyote=0;player.q=-.3;emit('jump');snd(330,.1,'square',.04,260)}
    else if(L('djump')&&player.airJ>0){player.airJ--;player.v.y=9.2*Math.sqrt(mv('djump','force'));player.q=-.3;emit('jump');ringFx(player.p.x,player.p.z,1.2);snd(440,.1,'square',.04,300)}
    else if(L('slam')&&!player.slam&&player.p.y>player.r+.4){player.slam=true;player.v.y=-32;player.v.x*=.3;player.v.z*=.3}
  }
  for(const k in cds)cds[k]-=dt;
  if(actQ.dash&&L('dash')&&cds.dash<=0){const sp=19*mv('dash','force');player.v.x=player.face.x*sp;player.v.z=player.face.z*sp;
    player.dashT=.28;cdmax.dash=cds.dash=1.1/mv('dash','speed');snd(180,.18,'sawtooth',.05,500);burst(player.p,0xffd23f,6)}
  if(actQ.grapple&&L('grapple')&&cds.grapple<=0)doGrapple();
  if(actQ.bomb&&L('bomb')&&cds.bomb<=0)doBomb();
  if(actQ.blink&&L('blink')&&cds.blink<=0)doBlink();
  jumpQ=false;for(const k in actQ)actQ[k]=false; player.dashT-=dt;player.inv-=dt;

  // --- rule spawns
  if(L('sumo')){const cap=Math.round(5*mv('sumo','count'));timers.dummy-=dt;
    if(timers.dummy<=0&&bodies.filter(b=>b.kind==='dummy').length<cap){spawnDummy();timers.dummy=1.6/mv('sumo','count')}}
  if(L('orbs')){const cap=Math.round(6*mv('orbs','count'));timers.orb-=dt;
    if(timers.orb<=0&&orbs.filter(o=>o.id==='orbs').length<cap){spawnOrb();timers.orb=.7/mv('orbs','count')}}
  if(L('tag')){timers.runner-=dt;if(timers.runner<=0&&bodies.filter(b=>b.kind==='runner').length<Math.round(mv('tag','count'))){spawnRunner();timers.runner=1}}
  if(L('medkit')){timers.med-=dt;if(timers.med<=0){timers.med=PICK_EVERY;for(let i=0,n=Math.round(mv('medkit','count'));i<n;i++)spawnHeart()}}
  // --- prompts: each fires on its timer, or on its trigger once rewired

  if(--S.pickLeft>0){S.offers=S.offers.filter(x=>x!==o&&(x.card?!L(x.card.id):true));if(S.offers.length){$('pickeyebrow').textContent='Pick one more';$('pickhead').textContent='Pick one more.';$('cards').innerHTML=S.offers.map(cardHTML).join('');chips();return}}
  if(L('compound'))S.infl*=1.05;
  if(L('pact')){const pr=CARDS.filter(c=>c.type==='prompt'&&FIRE[c.id]&&!L(c.id)&&unlocked(c.id)&&!excluded(c));if(pr.length){const c=pr[Math.floor(rng()*pr.length)];S.lv[c.id]=1;S.picks.push(c.id);floater('Pact: '+c.name,player.p.clone(),true)}}
  if(L('echo')&&S.pickCount%3===0&&S.lastMod){const m=S.lastMod,hosts=S.picks.filter(id=>id!==m.host&&stacks(id,m.mod)<2&&(m.mod==='score'?byId[id].earn:byId[id].mods&&byId[id].mods[m.mod]));
    if(hosts.length){const t=hosts[Math.floor(rng()*hosts.length)],mm=S.mods[t]||(S.mods[t]={});mm[m.mod]=(mm[m.mod]||0)+1;banner('Echo: '+MODS.find(x=>x.id===m.mod).name+' '+byId[t].name)}}
  $('pick').hidden=true;chips();
  if(S.pickCount>1)S.hearts=Math.min(maxH(),S.hearts+1);
  if(L('countdown'))S.clock=Math.min(180,S.clock+10);
  resumePlay();
}

/* ---------- flow ---------- */
// After a choice: apply the new card and carry on from exactly where play stopped.
function resumePlay(){
  applyStatics();timers.pick=PICK_EVERY*draftNeed();S.pickBase=S.earned;S.koSince=0;S.lapN=0;lapMk.visible=false;S.cleanT=0;jumpQ=false;
  if(L('foresight'))S.nextOffers=pickOffers();else S.nextOffers=null;for(const k in actQ)actQ[k]=false;
  if(S.t===0){const[sx,sz]=ARENA.nearest(0,0,2);player.p.set(sx,player.r+ARENA.fy(sx,sz),sz);player.v.set(0,0,0);banner('Go!')}
  player.inv=Math.max(player.inv,1);S.phase='play';hudCache='';last=performance.now();if(coarse)$('touch').hidden=false;
}
function startBoss(){
  S.boss=true;S.bossDown=false;S.bossN++;S.bossEnd=S.t+BOSS_LEN;ev.bossT=3;spawnBoss();
  const w=S.picks.map(id=>byId[id]).find(c=>c.type==='prompt');banner('Boss: '+(w?w.word:'Crunch')+' Deadline');snd(110,.8,'sawtooth',.1,-50);nz(.8,.2,'lowpass',300,80);
}
function endBoss(){
  S.boss=false;S.nextBoss+=BOSS_EVERY;
  for(const b of bodies)if(b.kind==='boss'){b.dead=true;world.remove(b.mesh)}bodies=bodies.filter(b=>!b.dead);
  if(!S.bossDown){bossPay(150,player.p.clone());banner('Boss survived')}
  S.hearts=maxH();timers.pick=Math.min(timers.pick,1.5);
}
function gameTitle(){
  const P=S.picks.map(id=>byId[id]),pr=P.find(c=>c.type==='prompt'),go=P.find(c=>c.goal),w=P.filter(c=>c.type==='rule'&&c.word&&!c.goal).pop();
  return [w&&w.word,pr&&modNames(pr.id)[0],pr&&pr.word,go&&modNames(go.id)[0],go?go.word:'Prototype'].filter(Boolean).join(' ');
}
function buildSheet(){
  const P=S.picks.map(id=>byId[id]),join=a=>a.length>4?a.slice(0,3).join(', ')+' and '+(a.length-3)+' more':a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0];
  const verbs=P.filter(c=>c.type==='rule'&&!c.goal&&!c.cam&&c.pitch).map(c=>c.pitch),goals=P.filter(c=>c.goal).map(c=>c.pitch),threats=P.filter(c=>c.type==='prompt').map(c=>c.pitch),cam=P.find(c=>c.cam);
  const pitch=`${cam?'A '+cam.pitch:'An'} arena brawler where you ${join(verbs.length?verbs:['roll and jump'])} to ${join(goals.length?goals:['survive'])}`+(threats.length?` through ${join(threats)}.`:'.');
  const lines=P.map(c=>{const m=modNames(c.id);return `${TYPE[c.type][0].padEnd(7)}${c.name}${m.length?' × '+m.join(' × '):''}  —  ${c.earn?fmt(S.by[c.id]||0):'no score'}`});
  if(S.bossPts)lines.push(`Boss   ${S.bossKills} knocked off  —  ${fmt(S.bossPts)}`);
  return `${gameTitle().toUpperCase()}\n${pitch}\n\n${lines.join('\n')}\n\nScore ${fmt(S.score)} = income ${fmt(S.income)} + bounties ${fmt(S.bounty)}\n`
    +`Shut down at ${mmss(S.t)} after ${S.pickCount} picks\n\nBuild code: ${encodeBuild()}`;
}
function refreshTitle(){
  const n=unlockedN(),total=CARDS.length,open=save.all||!storageOK?total:total-LOCK_ORDER.length+n,nSyn=CARDS.filter(c=>c.syn).length;
  $('career').textContent=open+' of '+total+' cards'+(save.best?' · best '+fmt(save.best):'');
  $('unlockall').textContent=save.all?'LOCK CARDS AGAIN':'UNLOCK ALL CARDS';$('unlockall').hidden=!storageOK;
}
function gameOver(){
  if(S.phase==='over')return;S.phase='over';$('pause').hidden=true;if(L('decay'))S.score=Math.max(S.score,S.peak);const sc=Math.round(S.score),wasBest=sc>save.best&&sc>0;
  const before=unlockedN();save.xp+=sc;const after=unlockedN();if(sc>save.best)save.best=sc;
  if(S.run==='daily'&&(save.daily.day!==S.day||sc>save.daily.score))save.daily={day:S.day,score:sc};
  persist();
  const newly=LOCK_ORDER.slice(before,after).map(id=>byId[id].name);
  $('unlocks').textContent=save.all||!storageOK?'':newly.length?'Unlocked: '+newly.join(', '):after<LOCK_ORDER.length?fmt(need(after+1)-save.xp)+' more points unlocks '+byId[LOCK_ORDER[after]].name:'Every card is unlocked';
  $('overeyebrow').textContent=(S.run==='daily'?'Daily build · ':S.run==='code'?'Shared build · ':'')+'Lasted '+mmss(S.t)+(wasBest?' · new best':'');
  S.code=encodeBuild();try{if(S.picks.length)location.hash=S.code}catch(e){}
  setupSubmit(sc);
  $('gamename').textContent=gameTitle();$('finalscore').textContent=fmt(sc);$('sheet').textContent=buildSheet();
  $('copy').textContent='COPY BUILD SHEET';$('copycode').textContent='COPY BUILD CODE';$('over').hidden=false;canvas.style.filter='';stopT=slowT=0;$('touch').hidden=true;snd(200,.6,'sawtooth',.08,-150);
}
function startRun(mode,data){
  if(typeof mode!=='string')mode='normal';audioInit();
  Object.assign(S,{run:mode,day:today(),seed:mode==='daily'?today():mode==='code'?data.seed:(Math.random()*2147483647)|0,code:'',
    picks:[],lv:{},mods:{},trig:{},by:{},score:0,income:0,bounty:0,hearts:MAXH,t:0,earned:0,pickBase:0,koSince:0,lapN:0,cleanT:0,unbanked:0,clock:60,peak:0,rentT:60,rentBase:0,infl:1,inflF:1,forceCut:false,lastMod:null,nextOffers:null,pickLeft:1,reroll:1,pickCount:0,lastFall:-1,streak:0,lastScore:-9,cutAt:0,mode:'draft',boss:false,bossDown:false,bossN:0,nextBoss:BOSS_EVERY,bossEnd:0,bossPts:0,bossKills:0,hunt:0,healT:-99});
  lastShown=[];passed={};lbPosted=false;seedRng(S.seed);musicSetup();
  resetRunState();player.p.set(0,player.r,0);player.v.set(0,0,0);
  $('title').hidden=true;$('over').hidden=true;$('pick').hidden=true;$('hud').hidden=false;hudCache='';
  if(mode==='code'){for(const c of data.cards){S.lv[c.id]=1;S.picks.push(c.id);if(Object.keys(c.mods).length)S.mods[c.id]=c.mods;if(c.trig)S.trig[c.id]=c.trig}
    S.pickCount=S.cutAt=S.picks.length;chips();return resumePlay()}
  chips();showPick();
}
function playCode(e){if(e)e.preventDefault();const d=decodeBuild($('codein').value);$('codeerr').hidden=!!d;
  if(!d){$('codeerr').textContent='That code does not look right. Build codes start with fc1-';return}startRun('code',d)}
function copyText(text,btn,fallbackEl){const done=()=>btn.textContent='COPIED',sel=()=>{const r=document.createRange();r.selectNodeContents(fallbackEl);const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='SELECTED · PRESS COPY'};
  try{navigator.clipboard.writeText(text).then(done,sel)}catch(e){sel()}}
function readHash(){if(decodeBuild(location.hash)){$('codein').value=location.hash.replace(/^#/,'');$('playcode').classList.remove('ghost')}}
$('daily').onclick=()=>startRun('daily');$('pausebtn').onclick=pause;$('resume').onclick=resume;$('endrun').onclick=gameOver;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
$('codeform').addEventListener('submit',playCode);
$('unlockall').onclick=()=>{save.all=!save.all;persist();refreshTitle()};
$('home').onclick=()=>{S.phase='title';$('over').hidden=true;$('hud').hidden=true;clearEntities();removePickup();refreshTitle();readHash();refreshBoard();$('title').hidden=false};
$('copycode').onclick=()=>copyText(S.code,$('copycode'),$('sheet'));
addEventListener('hashchange',readHash);readHash();refreshTitle();refreshBoard();
$('submitbox').addEventListener('submit',submitScore);
$('start').onclick=()=>startRun('normal');$('again').onclick=()=>startRun(S.run==='daily'?'daily':'normal');$('skip').onclick=()=>{if(S.mode==='cut'){S.cutAt=S.pickCount;showPick(true)}};
$('cards').addEventListener('click',e=>{const b=e.target.closest('.card');if(b)choose(+b.dataset.i)});
$('reroll').onclick=()=>{if(S.reroll>0){S.reroll--;showPick(true)}};
$('mute').onclick=()=>{muted=!muted;if(musG)musG.gain.value=muted?0:.4;$('mute').textContent=muted?'SOUND OFF':'SOUND ON'};
$('copy').onclick=()=>copyText($('sheet').textContent,$('copy'),$('sheet'));

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;
  let sdt=0;
  if(stopT>0)stopT-=rdt;
  else if(S.phase==='play'&&!document.hidden){sdt=rdt*(slowT>0?.35:1);slowT-=rdt;const n=sdt>.02?2:1;for(let i=0;i<n&&S.phase==='play';i++)update(sdt/n)}
  visuals(S.phase==='play'?sdt:0,rdt);
  if(S.phase!=='title')hud();
  music();
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__fc={S,L,LB,FIRE,ev,holeAt,crumb,get pitList(){return pitList},tw,ARENA,SHAPES,excluded,slotHolder,lapMk,bankMk,get pks(){return pks},spawnPickup,draftProgress,resumePlay,refreshBoard,save,encodeBuild,decodeBuild,unlocked,choose,player,update,CARDS,MODS,TRIGS,PAY,FIRE,stick,ev,hill,flag,startRun,jump(){jumpQ=true},dash(){actQ.dash=true},act(k){actQ[k]=true},
  get bodies(){return bodies},get bumpers(){return bumpers},get orbs(){return orbs},get meteors(){return meteors},get mines(){return mines},get R(){return R},
  arms(){const a=laserPivot.children.filter(m=>m.userData.i!==undefined);return a.map(m=>laserA+m.userData.i*6.283/a.length)}};
